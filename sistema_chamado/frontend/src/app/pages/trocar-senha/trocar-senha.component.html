<section class="card form-card"><h1>Alterar senha</h1><form (ngSubmit)="salvar()"><label>Senha atual<input type="password" name="atual" [(ngModel)]="senhaAtual" required autocomplete="current-password"></label><label>Nova senha<input type="password" name="nova" [(ngModel)]="novaSenha" required minlength="6" maxlength="72" autocomplete="new-password"></label>@if (mensagemErro) { <p class="error" role="alert">{{ mensagemErro }}</p> }<button [disabled]="carregando">Salvar nova senha</button></form></section>
