services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sistema_chamado
      POSTGRES_USER: chamados
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chamados_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamados -d sistema_chamado"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sistema_chamado
      SPRING_DATASOURCE_USERNAME: chamados
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-chamados_local}
      DEMO_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
