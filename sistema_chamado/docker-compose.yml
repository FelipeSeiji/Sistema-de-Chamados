services:

  # ================================================
  # Banco de dados PostgreSQL
  # ================================================
  postgres:
    image: postgres:16-alpine
    container_name: sistema_chamado_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sistema_chamado
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_chamado"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================================
  # Aplicação Spring Boot (Backend)
  # ================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema_chamado_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sistema_chamado
      DB_USER: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  # ================================================
  # Frontend Angular (Nginx)
  # ================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sistema_chamado_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - app

# ================================================
# Volumes persistentes
# ================================================
volumes:
  postgres_data:
    driver: local
